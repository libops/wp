name: sitectl-create-smoke-test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sitectl-create-smoke-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  create:
    name: sitectl create wp ${{ matrix.create_definition }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - create_definition: default
            create_args: >-
              --yolo
    uses: libops/.github/.github/workflows/sitectl-create-smoke-test.yaml@92a70c027cfe2553a8bc4adaba67a3e620ff6958 # main
    with:
      plugin: wp
      create-definition: ${{ matrix.create_definition }}
      create-args: ${{ matrix.create_args }}
      local-plugin-path: sitectl-wp
      local-plugin-repository: libops/sitectl-wp
      local-plugin-ref: 40e97cbdfee19fd443ccebf7701b44ad035340ca
      packages: sitectl
      package-versions: sitectl=1.8.1
      allow-unversioned-packages: false
      run-verify: true
      verify-args: --disposable
