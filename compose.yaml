---
x-common: &common
  restart: unless-stopped
  networks:
    default:

networks:
  default:
volumes:
  mariadb-data: {}
  wordpress-uploads: {}

secrets:
  DB_ROOT_PASSWORD:
    file: ./secrets/DB_ROOT_PASSWORD
  WORDPRESS_DB_PASSWORD:
    file: ./secrets/WORDPRESS_DB_PASSWORD
  WORDPRESS_ADMIN_PASSWORD:
    file: ./secrets/WORDPRESS_ADMIN_PASSWORD
  WORDPRESS_AUTH_KEY:
    file: ./secrets/WORDPRESS_AUTH_KEY
  WORDPRESS_SECURE_AUTH_KEY:
    file: ./secrets/WORDPRESS_SECURE_AUTH_KEY
  WORDPRESS_LOGGED_IN_KEY:
    file: ./secrets/WORDPRESS_LOGGED_IN_KEY
  WORDPRESS_NONCE_KEY:
    file: ./secrets/WORDPRESS_NONCE_KEY
  WORDPRESS_AUTH_SALT:
    file: ./secrets/WORDPRESS_AUTH_SALT
  WORDPRESS_SECURE_AUTH_SALT:
    file: ./secrets/WORDPRESS_SECURE_AUTH_SALT
  WORDPRESS_LOGGED_IN_SALT:
    file: ./secrets/WORDPRESS_LOGGED_IN_SALT
  WORDPRESS_NONCE_SALT:
    file: ./secrets/WORDPRESS_NONCE_SALT

services:
  traefik:
    <<: *common
    image: traefik:v3.7.13@sha256:f86a2cab1b5c649070c49f883c743dd32d8485a56e3368c5f93b9e91f1e91259
    command:
      - --ping=true
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.transport.respondingTimeouts.readTimeout=300s
    ports:
      - "80:80"
    volumes:
      - ./conf/traefik:/etc/traefik/dynamic:ro,z
    depends_on:
      wp:
        condition: service_healthy
    healthcheck:
      test: traefik healthcheck --ping
      start_period: 10s

  init:
    image: libops/base:3.2.2.0@sha256:57b396fd8b681d626c89359e3f68618d4822f46c9364854c9d4747c25ab9d705
    restart: no
    working_dir: /work
    environment:
      COMPOSE_FILE: /work/compose.yaml
      SECRETS_ROOT: /work/secrets
    volumes:
      - ./certs:/work/certs:rw,z
      - ./secrets:/work/secrets:rw,z
      - ./compose.yaml:/work/compose.yaml:ro,z
    entrypoint: generate-compose-secrets.sh
    profiles: [none]

  wp:
    <<: *common
    build:
      context: .
    working_dir: /var/www/bedrock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LIBOPS_SMTP_HOST: "${LIBOPS_SMTP_HOST:-host.docker.internal}"
      LIBOPS_SMTP_PORT: "${LIBOPS_SMTP_PORT:-25}"
      SMTP_FROM: "${SMTP_FROM:-}"
      INGRESS_HOSTNAMES: "localhost"
      INGRESS_SCHEME: "http"
    secrets:
      - source: WORDPRESS_AUTH_KEY
      - source: WORDPRESS_SECURE_AUTH_KEY
      - source: WORDPRESS_LOGGED_IN_KEY
      - source: WORDPRESS_NONCE_KEY
      - source: WORDPRESS_AUTH_SALT
      - source: WORDPRESS_SECURE_AUTH_SALT
      - source: WORDPRESS_LOGGED_IN_SALT
      - source: WORDPRESS_NONCE_SALT
      - source: WORDPRESS_DB_PASSWORD
        target: DB_PASSWORD
      - source: WORDPRESS_ADMIN_PASSWORD
    volumes:
      - wordpress-uploads:/var/www/bedrock/web/app/uploads:rw
      - ./scripts/wordpress-locked-core.php:/usr/local/lib/sitectl/wordpress-locked-core.php:ro,z
      - ./scripts/wordpress-runtime-state.php:/usr/local/lib/sitectl/wordpress-runtime-state.php:ro,z
      - ./scripts/wordpress-media-fixture.php:/usr/local/lib/sitectl/wordpress-media-fixture.php:ro,z
      - ./scripts/wordpress-media-round-trip.sh:/usr/local/lib/sitectl/wordpress-media-round-trip.sh:ro,z
      - ./scripts/wordpress-wait-installed.sh:/usr/local/lib/sitectl/wordpress-wait-installed.sh:ro,z
    depends_on:
      database-init:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
    healthcheck:
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5m

  database-init:
    image: libops/base:3.2.2.0@sha256:57b396fd8b681d626c89359e3f68618d4822f46c9364854c9d4747c25ab9d705
    restart: "no"
    networks:
      default:
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: wordpress
      DB_USER: wordpress
      DB_CHARACTER_SET: utf8mb4
      DB_COLLATION: utf8mb4_unicode_ci
    secrets:
      - source: DB_ROOT_PASSWORD
      - source: WORDPRESS_DB_PASSWORD
        target: DB_PASSWORD
    entrypoint: /usr/local/bin/init-database.sh
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    <<: *common
    image: libops/mariadb:11@sha256:52bc6b83b75921239237d57db7b14fb7cbcecafee6ce110c49fd31d990ec0828
    volumes:
      - mariadb-data:/var/lib/mysql:rw
    secrets:
      - source: DB_ROOT_PASSWORD
